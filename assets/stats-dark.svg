<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="206" viewBox="0 0 1200 206" role="img" aria-labelledby="title" data-refreshed="16 Sep 2026">
  <title id="title">86 PRs merged upstream across 17 repositories, 42 into Apache Beam, 12 open-source orgs, 54.8k npm downloads.</title>
  <style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
  .rise { animation: rise 0.9s cubic-bezier(0.23, 1, 0.32, 1) both; }
  .ping { animation: ping 2.2s cubic-bezier(0, 0, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
  .blink { animation: blink 1.05s step-end infinite; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes ping { 0% { opacity: 0.7; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .ping { opacity: 0; }
  }
  </style>
  <rect x="0.5" y="0.5" width="1199" height="205" rx="16" fill="#08090a" stroke="rgba(255,255,255,0.11)"/>
  <circle class="ping" cx="44" cy="32" r="3.5" fill="#47b990"/><circle cx="44" cy="32" r="3.5" fill="#47b990"/>
  <text x="58" y="36.5" class="mono" font-size="12" letter-spacing="1.5" fill="#8a8e96">LIVE FROM THE GITHUB AND NPM APIS</text>
  <text x="1160" y="36.5" text-anchor="end" class="mono" font-size="12" fill="#8a8e96">refreshed 16 Sep 2026</text>
  <line x1="0.5" x2="1199.5" y1="56.5" y2="56.5" stroke="rgba(255,255,255,0.11)"/>
  
  <g class="rise" style="animation-delay: 0.1s">
    <text x="40" y="128" class="sans" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f2f3f4">86</text>
    <text x="40" y="154" class="sans" font-size="16" fill="#a1a5ac">PRs merged upstream</text>
    <text x="40" y="177" class="mono" font-size="12" fill="#8a8e96">across 17 repositories</text>
  </g>
  <line x1="320" x2="320" y1="84" y2="178" stroke="rgba(255,255,255,0.11)"/>
  <g class="rise" style="animation-delay: 0.18s">
    <text x="348" y="128" class="sans" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f2f3f4">42</text>
    <text x="348" y="154" class="sans" font-size="16" fill="#a1a5ac">of them into Apache Beam</text>
    <text x="348" y="177" class="mono" font-size="12" fill="#8a8e96">the Kafka Streams runner</text>
  </g>
  <line x1="600" x2="600" y1="84" y2="178" stroke="rgba(255,255,255,0.11)"/>
  <g class="rise" style="animation-delay: 0.26s">
    <text x="628" y="128" class="sans" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f2f3f4">12</text>
    <text x="628" y="154" class="sans" font-size="16" fill="#a1a5ac">open-source orgs</text>
    <text x="628" y="177" class="mono" font-size="12" fill="#8a8e96">Apache, InsForge, webpack…</text>
  </g>
  <line x1="880" x2="880" y1="84" y2="178" stroke="rgba(255,255,255,0.11)"/>
  <g class="rise" style="animation-delay: 0.33999999999999997s">
    <text x="908" y="128" class="sans" font-size="52" font-weight="700" letter-spacing="-1.5" fill="#f2f3f4">54.8k</text>
    <text x="908" y="154" class="sans" font-size="16" fill="#a1a5ac">npm downloads</text>
    <text x="908" y="177" class="mono" font-size="12" fill="#8a8e96">across 4 packages</text>
  </g>
</svg>
